<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="options.title">JoyFox options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="joyfox-options">
    <header class="joyfox-options__header">
      <div class="joyfox-options__title-row">
        <h1>JoyFox</h1>
        <!-- Bilingual and never translated, so a user who cannot read the
             current language can still find it (docs/i18n-spec.md, 3.9). -->
        <p class="joyfox-options__language">
          <label for="joyfox-language">Sprache / Language</label>
          <select id="joyfox-language">
            <option value="de" lang="de">Deutsch</option>
            <option value="en" lang="en">English</option>
          </select>
        </p>
      </div>
      <p class="joyfox-options__intro" data-i18n="options.intro">
        JoyFox stores everything locally in this browser profile. Inbox triage
        stays off until you save a contact rule.
      </p>
    </header>
    <nav
      class="joyfox-tabs"
      role="tablist"
      aria-label="JoyFox options"
      data-i18n-attr="aria-label:options.title"
    >
      <a
        role="tab"
        id="tab-start"
        href="#start"
        aria-controls="panel-start"
        data-i18n="options.tabs.start"
        >Get started</a
      >
      <a
        role="tab"
        id="tab-accounts"
        href="#accounts"
        aria-controls="panel-accounts"
        data-i18n="options.tabs.accounts"
        >Accounts</a
      >
      <a
        role="tab"
        id="tab-rule"
        href="#rule"
        aria-controls="panel-rule"
        data-i18n="options.tabs.rule"
        >Contact rule</a
      >
      <a
        role="tab"
        id="tab-templates"
        href="#templates"
        aria-controls="panel-templates"
        data-i18n="options.tabs.templates"
        >Templates</a
      >
      <a
        role="tab"
        id="tab-events"
        href="#events"
        aria-controls="panel-events"
        data-i18n="options.tabs.events"
        >Events</a
      >
      <a
        role="tab"
        id="tab-data"
        href="#data"
        aria-controls="panel-data"
        data-i18n="options.tabs.data"
        >Your data</a
      >
    </nav>
    <div
      role="tabpanel"
      id="panel-start"
      aria-labelledby="tab-start"
      class="joyfox-tabpanel"
    >
      <section id="joyfox-get-started"></section>
    </div>
    <div
      role="tabpanel"
      id="panel-accounts"
      aria-labelledby="tab-accounts"
      class="joyfox-tabpanel"
    >
      <section id="joyfox-accounts"></section>
      <section
        id="joyfox-import"
        aria-label="Import JoyFox data"
        data-i18n-attr="aria-label:options.importRegion"
      ></section>
    </div>
    <div
      role="tabpanel"
      id="panel-rule"
      aria-labelledby="tab-rule"
      class="joyfox-tabpanel"
    >
      <section id="joyfox-rule"></section>
    </div>
    <div
      role="tabpanel"
      id="panel-templates"
      aria-labelledby="tab-templates"
      class="joyfox-tabpanel"
    >
      <section id="joyfox-templates"></section>
    </div>
    <div
      role="tabpanel"
      id="panel-events"
      aria-labelledby="tab-events"
      class="joyfox-tabpanel"
    >
      <section id="joyfox-events"></section>
    </div>
    <div
      role="tabpanel"
      id="panel-data"
      aria-labelledby="tab-data"
      class="joyfox-tabpanel"
    >
      <section id="joyfox-data"></section>
    </div>
    <script src="options.js"></script>
  </body>
</html>
